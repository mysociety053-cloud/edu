                      <div className="flex items-start gap-3">
                        <div className="flex-shrink-0 w-12 h-12 rounded-full bg-emerald-500 text-white flex items-center justify-center font-black text-xl shadow-lg">1</div>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 mb-1">
                            <span className="text-2xl">😊</span>
                            <h4 className="text-base font-black text-emerald-900">먼저 바로 앞 차시로!</h4>
                          </div>
                          <p className="text-sm text-emerald-700 mb-3">방금 배운 차시를 다시 한 번 보면 금방 떠올라요</p>
                          {currentLesson.fallbackChain.tier1 ? (
                            <button
                              onClick={() => { const next = lessons.find(l => l.id === currentLesson.fallbackChain.tier1.id); if (next) { setCurrentLesson(next); markVisited(next.id); window.scrollTo({ top: 0, behavior: 'smooth' }); } }}
                              className="w-full bg-white hover:bg-emerald-50 border-2 border-emerald-300 hover:border-emerald-500 rounded-xl px-4 py-3 text-left transition-all group shadow-sm hover:shadow"
                            >
                              <div className="flex items-center gap-3">
                                <span className="flex-shrink-0 bg-emerald-500 text-white text-xs font-black px-2.5 py-1 rounded-lg">{currentLesson.fallbackChain.tier1.number}</span>
                                <span className="flex-1 text-sm font-bold text-slate-800">{currentLesson.fallbackChain.tier1.title}</span>
                                <span className="flex-shrink-0 bg-emerald-100 group-hover:bg-emerald-500 group-hover:text-white text-emerald-700 rounded-full px-3 py-1 text-xs font-bold transition-all">가볼래요 →</span>
                              </div>
                            </button>
                          ) : (
                            <div className="bg-white/60 rounded-xl px-4 py-2.5 text-xs text-emerald-700 italic">이 단원의 첫 번째 차시예요. 2단계로 가볼까요? ↓</div>
                          )}
                        </div>
                      </div>
                    </div>
                    {/* 화살표 연결 */}
                    <div className="flex justify-center -mb-1.5">
                      <div className="w-0.5 h-3 bg-slate-300"></div>
                    </div>
                  </div>

                  {/* 2단계 */}
                  <div className="relative">
                    <div className="bg-gradient-to-br from-amber-50 to-amber-100 rounded-2xl p-4 border-2 border-amber-200 hover:border-amber-400 transition-all">
                      <div className="flex items-start gap-3">
                        <div className="flex-shrink-0 w-12 h-12 rounded-full bg-amber-500 text-white flex items-center justify-center font-black text-xl shadow-lg">2</div>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 mb-1">
                            <span className="text-2xl">🤔</span>
                            <h4 className="text-base font-black text-amber-900">그래도 어려우면 더 앞 차시로!</h4>
                          </div>
                          <p className="text-sm text-amber-700 mb-3">이 단원의 다른 차시도 한 번 다시 봐요</p>
                          {currentLesson.fallbackChain.tier2 && currentLesson.fallbackChain.tier2.length > 0 ? (
                            <div className="space-y-2">
                              {currentLesson.fallbackChain.tier2.map((item, idx) => (
                                <button
                                  key={idx}
                                  onClick={() => { const next = lessons.find(l => l.id === item.id); if (next) { setCurrentLesson(next); markVisited(next.id); window.scrollTo({ top: 0, behavior: 'smooth' }); } }}
                                  className="w-full bg-white hover:bg-amber-50 border-2 border-amber-300 hover:border-amber-500 rounded-xl px-4 py-3 text-left transition-all group shadow-sm hover:shadow"
                                >
                                  <div className="flex items-center gap-3">
                                    <span className="flex-shrink-0 bg-amber-500 text-white text-xs font-black px-2.5 py-1 rounded-lg">{item.number}</span>
                                    <span className="flex-1 text-sm font-bold text-slate-800">{item.title}</span>
                                    <span className="flex-shrink-0 bg-amber-100 group-hover:bg-amber-500 group-hover:text-white text-amber-700 rounded-full px-3 py-1 text-xs font-bold transition-all">가볼래요 →</span>
                                  </div>
                                </button>
                              ))}
                            </div>
                          ) : (
                            <div className="bg-white/60 rounded-xl px-4 py-2.5 text-xs text-amber-700 italic">더 앞 차시는 없어요. 3단계로 가볼까요? ↓</div>
                          )}
                        </div>
                      </div>
                    </div>
                    <div className="flex justify-center -mb-1.5">
                      <div className="w-0.5 h-3 bg-slate-300"></div>
                    </div>
                  </div>

                  {/* 3단계 */}
                  <div className="relative">
                    <div className="bg-gradient-to-br from-orange-50 to-orange-100 rounded-2xl p-4 border-2 border-orange-200 hover:border-orange-400 transition-all">
                      <div className="flex items-start gap-3">
                        <div className="flex-shrink-0 w-12 h-12 rounded-full bg-orange-500 text-white flex items-center justify-center font-black text-xl shadow-lg">3</div>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 mb-1">
                            <span className="text-2xl">😅</span>
                            <h4 className="text-base font-black text-orange-900">다른 단원에서 도움받기!</h4>
                          </div>
                          <p className="text-sm text-orange-700 mb-3">이번 학기에 배운 다른 단원도 떠올려봐요</p>
                          {currentLesson.fallbackChain.tier3 && currentLesson.fallbackChain.tier3.length > 0 ? (
                            <div className="space-y-2">
                              {currentLesson.fallbackChain.tier3.map((item, idx) => (
                                <div key={idx} className="bg-white border-2 border-orange-200 rounded-xl px-4 py-3">
                                  <div className="flex items-center gap-2 mb-1.5">
                                    <span className="bg-orange-500 text-white text-xs font-black px-2.5 py-1 rounded-lg">{item.unit} {item.no}</span>
                                    <span className="text-sm font-bold text-slate-800">{item.title}</span>
                                  </div>
                                  {item.subTitle && <p className="text-xs text-slate-600 ml-1 mb-2">📖 {item.subTitle}</p>}
                                  <div className="bg-orange-50 border border-orange-200 rounded-lg px-3 py-2">
                                    <p className="text-xs text-orange-800 leading-relaxed"><span className="font-bold">💡 왜 도움되냐면 </span>{item.why}</p>
                                  </div>
                                </div>
                              ))}
                            </div>
                          ) : (
                            <div className="bg-white/60 rounded-xl px-4 py-2.5 text-xs text-orange-700 italic">이번 학기 다른 단원에 도움될 차시는 없어요. 4단계로 가볼까요? ↓</div>
                          )}
                        </div>
                      </div>
                    </div>
                    <div className="flex justify-center -mb-1.5">
                      <div className="w-0.5 h-3 bg-slate-300"></div>
                    </div>
                  </div>

                  {/* 4단계 */}
                  <div>
                    <div className="bg-gradient-to-br from-rose-50 to-pink-100 rounded-2xl p-4 border-2 border-rose-200 hover:border-rose-400 transition-all">
                      <div className="flex items-start gap-3">
                        <div className="flex-shrink-0 w-12 h-12 rounded-full bg-rose-500 text-white flex items-center justify-center font-black text-xl shadow-lg">4</div>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 mb-1">
                            <span className="text-2xl">💪</span>
                            <h4 className="text-base font-black text-rose-900">예전에 배운 걸 다시 떠올려요!</h4>
                          </div>
                          <p className="text-sm text-rose-700 mb-3">지난 학년에 배웠던 거 기억나죠?</p>
                          {currentLesson.fallbackChain.tier4 && currentLesson.fallbackChain.tier4.length > 0 ? (
                            <div className="space-y-2">
                              {currentLesson.fallbackChain.tier4.map((item, idx) => (
                                <div key={idx} className="bg-white border-2 border-rose-200 rounded-xl px-4 py-3">
                                  <div className="flex items-center gap-2 mb-1.5">
                                    <span className="bg-rose-500 text-white text-xs font-black px-2.5 py-1 rounded-lg">{item.unit} {item.no}</span>
                                    <span className="text-sm font-bold text-slate-800">{item.title}</span>
                                  </div>
                                  {item.subTitle && <p className="text-xs text-slate-600 ml-1 mb-2">📖 {item.subTitle}</p>}
                                  <div className="bg-rose-50 border border-rose-200 rounded-lg px-3 py-2">
                                    <p className="text-xs text-rose-800 leading-relaxed"><span className="font-bold">💡 왜 도움되냐면 </span>{item.why}</p>
                                  </div>
                                </div>
                              ))}
                            </div>
                          ) : (
                            <div className="bg-white/60 rounded-xl px-4 py-2.5 text-xs text-rose-700 italic">예전 학년에서 미리 배운 내용은 없어요. 선생님께 직접 물어볼까요?</div>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>

                </div>

                {/* 응원 메시지 */}
                <div className="bg-gradient-to-r from-indigo-50 to-purple-50 rounded-2xl p-4 border-2 border-indigo-100 text-center">
                  <div className="flex items-center justify-center gap-2 mb-1">
                    <span className="text-2xl">🌟</span>
                    <p className="text-sm font-bold text-indigo-900">한 단계씩 차근차근!</p>
                  </div>
                  <p className="text-xs text-indigo-700">한 번에 다 못해도 괜찮아요. 어제보다 한 발짝만 더 나아가면 충분해요.</p>
                </div>

                {currentLesson.prerequisite && currentLesson.prerequisite.length > 0 && (
                  <div className="bg-slate-50 rounded-xl px-4 py-3 flex items-center justify-between flex-wrap gap-2">
                    <div className="flex items-center gap-2 flex-wrap text-xs">
                      <span className="text-slate-500">📚 단원 시작 전 핵심:</span>
                      {currentLesson.prerequisite.map((p, idx) => (
                        <span key={idx} className="bg-white border border-slate-200 px-2 py-0.5 rounded font-bold text-slate-700">{p}</span>
                      ))}
                    </div>
                    <button onClick={() => setView('prerequisite')} className="text-xs font-bold text-emerald-700 hover:text-emerald-800 inline-flex items-center gap-1">선수개념 보러가기<ArrowRight className="w-3 h-3" /></button>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      };

      const renderTeacherDashboard = () => {
        const pendingCalls = calls.filter(c => c.status === 'pending');
        const callsByLesson = {};
        calls.forEach(c => { const key = c.location; callsByLesson[key] = (callsByLesson[key] || 0) + 1; });
        const sortedLessons = Object.entries(callsByLesson).sort((a, b) => b[1] - a[1]);
        const callsByType = {};
        calls.forEach(c => { callsByType[c.type.id] = (callsByType[c.type.id] || 0) + 1; });

        return (
          <div className="space-y-6">
            <div className="flex items-center justify-between">
              <div>
                <p className="text-xs font-semibold tracking-[0.2em] text-slate-500 mb-1">N-PROTOCOL · 교사 대시보드</p>
                <h1 className="text-3xl font-bold text-slate-900 tracking-tight">3학년 1반 분수 단원</h1>
                <p className="text-sm text-slate-500 mt-1">{new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' })}</p>
              </div>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              <div className="bg-white border border-slate-200 rounded-xl p-4"><div className="flex items-center gap-2 mb-2"><Users className="w-4 h-4 text-slate-500" /><p className="text-xs font-semibold text-slate-500">학급 학생</p></div><p className="text-2xl font-bold text-slate-900">25명</p></div>
              <div className="bg-white border border-slate-200 rounded-xl p-4"><div className="flex items-center gap-2 mb-2"><Activity className="w-4 h-4 text-emerald-500" /><p className="text-xs font-semibold text-slate-500">평균 진도</p></div><p className="text-2xl font-bold text-emerald-600">62%</p></div>
              <div className="bg-white border border-slate-200 rounded-xl p-4"><div className="flex items-center gap-2 mb-2"><Bell className="w-4 h-4 text-red-500" /><p className="text-xs font-semibold text-slate-500">대기 호출</p></div><p className="text-2xl font-bold text-red-600">{pendingCalls.length}건</p></div>
              <div className="bg-white border border-slate-200 rounded-xl p-4"><div className="flex items-center gap-2 mb-2"><Trophy className="w-4 h-4 text-blue-500" /><p className="text-xs font-semibold text-slate-500">총 호출</p></div><p className="text-2xl font-bold text-blue-600">{calls.length}건</p></div>
            </div>

            <div className="bg-white border-2 border-red-200 rounded-2xl p-6">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-2"><div className={`w-8 h-8 rounded-lg bg-red-500 flex items-center justify-center text-white ${pendingCalls.length > 0 ? 'pulse-ring' : ''}`}><Bell className="w-4 h-4" /></div><h3 className="font-bold text-slate-900">실시간 호출 알림</h3></div>
                <span className="text-xs font-semibold bg-red-100 text-red-700 px-2 py-1 rounded-md">대기 {pendingCalls.length}건</span>
              </div>
              {pendingCalls.length === 0 ? (
                <p className="text-center text-sm text-slate-500 py-8">현재 대기 중인 호출이 없어요</p>
              ) : (
                <div className="space-y-2">
                  {pendingCalls.map((call) => (
                    <div key={call.id} className="bg-red-50 border border-red-200 rounded-xl p-4 fade-in">
                      <div className="flex items-start gap-3">
                        <span className="text-2xl flex-shrink-0">{call.type.icon}</span>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 mb-1 flex-wrap"><h4 className="font-bold text-slate-900">{call.student}</h4><span className="text-xs text-slate-500">{call.time}</span></div>
                          <p className="text-sm font-medium text-red-700 mb-1">{call.type.label}</p>
                          <p className="text-xs text-slate-600">📍 {call.location}</p>
                        </div>
                        <button onClick={() => setCalls(prev => prev.map(c => c.id === call.id ? { ...c, status: 'resolved' } : c))} className="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg flex-shrink-0">처리완료</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="grid md:grid-cols-2 gap-4">
              <div className="bg-white border border-slate-200 rounded-2xl p-6">
                <h3 className="font-bold text-slate-900 mb-1 text-sm">차시별 호출 빈도</h3>
                <p className="text-xs text-slate-500 mb-4">학생들이 가장 많이 막힌 차시 순서</p>
                <div className="space-y-2">
                  {sortedLessons.slice(0, 5).map(([location, count], idx) => {
                    const maxCount = sortedLessons[0][1];
                    const percent = (count / maxCount) * 100;
                    return (
                      <div key={idx}>
                        <div className="flex items-center justify-between mb-1"><p className="text-xs font-medium text-slate-700 truncate flex-1 mr-2">{location}</p><span className="text-xs font-bold text-slate-900 flex-shrink-0">{count}건</span></div>
                        <div className="h-2 bg-slate-100 rounded-full overflow-hidden"><div className={`h-full rounded-full ${idx === 0 ? 'bg-red-500' : idx === 1 ? 'bg-orange-500' : 'bg-slate-400'}`} style={{ width: `${percent}%` }} /></div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="bg-white border border-slate-200 rounded-2xl p-6">
                <h3 className="font-bold text-slate-900 mb-1 text-sm">막힘 유형 분포</h3>
                <p className="text-xs text-slate-500 mb-4">학생들이 자주 호출하는 이유</p>
                <div className="space-y-3">
                  {callTypes.map((type) => {
                    const count = callsByType[type.id] || 0;
                    const percent = calls.length > 0 ? Math.round((count / calls.length) * 100) : 0;
                    return (
                      <div key={type.id}>
                        <div className="flex items-center justify-between mb-1"><div className="flex items-center gap-2"><span>{type.icon}</span><p className="text-xs font-medium text-slate-700">{type.label}</p></div><span className="text-xs font-bold text-slate-900">{count}건 ({percent}%)</span></div>
                        <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-slate-700 rounded-full" style={{ width: `${percent}%` }} /></div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            <div className="bg-white border border-slate-200 rounded-2xl p-6">
              <h3 className="font-bold text-slate-900 mb-1 text-sm">최근 호출 이력</h3>
              <p className="text-xs text-slate-500 mb-4">처리된 호출 포함 전체 기록</p>
              <div className="space-y-2">
                {calls.slice(0, 8).map((call) => (
                  <div key={call.id} className={`flex items-center gap-3 p-3 rounded-lg border ${call.status === 'pending' ? 'bg-red-50 border-red-100' : 'bg-slate-50 border-slate-100'}`}>
                    <span className="text-lg flex-shrink-0">{call.type.icon}</span>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 mb-0.5"><p className="font-semibold text-sm text-slate-900">{call.student}</p><span className="text-xs text-slate-400">·</span><span className="text-xs text-slate-500">{call.time}</span>{call.status === 'pending' ? <span className="text-xs bg-red-100 text-red-700 px-1.5 py-0.5 rounded font-semibold">대기</span> : <span className="text-xs bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded">처리완료</span>}</div>
                      <p className="text-xs text-slate-600 truncate">{call.type.label} · {call.location}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-amber-50 border border-amber-100 rounded-xl p-4">
              <p className="text-xs text-amber-800 leading-relaxed"><span className="font-semibold">시연 안내:</span> 이 대시보드는 실제 백엔드 구축 후 작동할 화면의 시연 버전입니다. 학생용 N-Protocol에서 호출 버튼을 누르면 실시간으로 이 화면 상단에 알림이 추가됩니다.</p>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-slate-50">
          <div className="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div className="max-w-6xl mx-auto px-5 py-3 flex items-center justify-between">
              <div className="flex items-center gap-2"><School className="w-5 h-5 text-slate-700" /><span className="text-sm font-bold text-slate-900">능동초 N-Protocol</span></div>
              <div className="flex items-center gap-1 bg-slate-100 rounded-lg p-1">
                <button onClick={() => setMode('student')} className={`text-xs font-semibold px-3 py-1.5 rounded-md transition-colors ${mode === 'student' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>학생용</button>
                <button onClick={() => setMode('teacher')} className={`text-xs font-semibold px-3 py-1.5 rounded-md transition-colors ${mode === 'teacher' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>교사용</button>
              </div>
            </div>
          </div>

          {mode === 'student' ? (
            <div className="max-w-2xl mx-auto px-5 py-8 sm:py-10 pb-32">
              {view === 'home' && renderHome()}
              {view === 'prerequisite' && renderPrerequisite()}
              {view === 'lesson' && renderLesson()}
            </div>
          ) : (
            <div className="max-w-6xl mx-auto px-5 py-8">{renderTeacherDashboard()}</div>
          )}

          {mode === 'student' && renderCallButton()}
          {mode === 'student' && renderCallModal()}
          {mode === 'student' && showQuiz && currentLesson && (
            <QuizModal 
              lesson={currentLesson} 
              onClose={() => setShowQuiz(false)}
              onComplete={handleQuizComplete}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NProtocol />);
  </script>
</body>
</html>
